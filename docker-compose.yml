services:
  datax-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datax-migration-studio
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - UVICORN_RELOAD=false
    volumes:
      # Persistencia de salidas SQLite generadas por robots de conversión
      - ./output:/app/output
      # Persistencia de archivos de muestra (Excel, PDF, etc.)
      - ./attachtments:/app/attachtments
      # Mapeo en caliente del código backend
      - ./core:/app/core
      - ./server:/app/server
      # Mapeo de repositorios locales (toma las rutas de cada usuario desde su .env)
      - ${OLD_REPO_PATH:-./repos/old}:/repos/old
      - ${NEW_REPO_PATH:-./repos/new}:/repos/new

