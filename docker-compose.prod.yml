services:
  datax-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datax-migration-studio
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8085}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - UVICORN_RELOAD=false
    volumes:
      # Persistencia de salidas SQLite y archivos de muestra
      - ./output:/app/output
      - ./attachtments:/app/attachtments
      # Mapeo de repositorios en el servidor (definidos en .env)
      - ${OLD_REPO_PATH:-./repos/old}:/repos/old
      - ${NEW_REPO_PATH:-./repos/new}:/repos/new

